<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quizzlet | Sign Up</title>
  <style>
    :root {
      --primary: #ff4e50;
      --secondary: #f9d423;
      --text-dark: #222;
      --text-light: #fff;
      --font: 'Poppins', sans-serif;
    }

    body {
      margin: 0;
      font-family: var(--font);
      background: linear-gradient(to right, #ffe259, #ffa751);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    nav {
      background: var(--primary);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 2rem;
      font-weight: bold;
      color: var(--text-light);
      text-decoration: none;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav ul li a {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 500;
    }

    .container {
      max-width: 400px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }

    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 6px;
      font-weight: 500;
    }

    input {
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    button {
      padding: 12px;
      font-size: 1rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #e03e45;
    }

    .footer {
      text-align: center;
      margin-top: auto;
      padding: 20px;
      background: var(--primary);
      color: white;
    }

    .switch-link {
      text-align: center;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .switch-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <nav>
    <a class="logo" href="homepage.html">Quizzlet</a>
    <ul>
      <li><a href="homepage.html">Home</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>

  <div class="container">
    <h1>Create an Account</h1>
    <form action="#" method="POST">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Your name" required />

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Create a password" required />

      <button type="submit">Sign Up</button>

      <div class="switch-link">
        Already have an account? <a href="login.html">Log in</a>
      </div>
    </form>
  </div>

  <div class="footer">
    Let’s make learning playful & powerful 💡
  </div>

</body>
</html>
