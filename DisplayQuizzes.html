<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quizzlet | Quiz Explorer</title>
<style>
:root {
--primary: #ff4e50;
--secondary: #f9d423;
--highlight: #ff6f61;
--text-dark: #222;
--text-light: #fff;
--font: 'Poppins', sans-serif;}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: var(--font);}

body {
background: linear-gradient(to right, #fceabb, #f8b500);
color: var(--text-dark);
min-height: 100vh;}

header {
background-color: var(--primary);
padding: 20px 40px;
display: flex;
justify-content: space-between;
align-items: center;
color: var(--text-light);}

.logo {
font-size: 2rem;
font-weight: bold;}

nav ul {
list-style: none;
display: flex;
gap: 25px;}

nav ul li a {
color: var(--text-light);
text-decoration: none;}

h1 {
color: var(--primary);
text-align: center;
margin: 40px 0 10px;}

.filters {
display: flex;
justify-content: center;
gap: 20px;
margin: 20px 0;
flex-wrap: wrap;}

.filters select, .filters input {
padding: 10px 15px;
border-radius: 8px;
border: none;
font-size: 1rem;}

.quiz-container {
display: flex;
flex-wrap: wrap;
justify-content: center;
gap: 20px;
padding: 20px;}

.quiz-card {
background: white;
border-radius: 12px;
box-shadow: 0 4px 6px rgba(0,0,0,0.1);
padding: 20px;
width: 220px;
text-align: center;
transition: transform 0.2s;}

.quiz-card:hover {
transform: scale(1.05);}

.quiz-card h3 {
margin-bottom: 8px;
color: var(--primary);}

.quiz-meta {
font-size: 0.85rem;
color: #666;
margin-bottom: 10px;}

.quiz-card button {
background-color: var(--highlight);
color: white;
padding: 8px 14px;
border: none;
border-radius: 8px;
cursor: pointer;
font-size: 0.9rem;}

footer {
text-align: center;
padding: 30px;
background-color: var(--primary);
color: white;}
a.logo {
  color: var(--text-light); /* or whatever color you want */
  text-decoration: none;
  font-size: 2rem;
  font-weight: bold;
}
</style>
</head>
<body>
  <header>
  <a href="homepage.html" class="logo">Quizzlet</a>
    <nav>
      <ul>
        <li><a href="homepage.html">Home</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <h1>Explore Quizzes</h1>

  <div class="filters">
    <select id="subjectFilter">
      <option value="all">All Subjects</option>
      <option value="math">Math</option>
      <option value="science">Science</option>
      <option value="history">History</option>
      <option value="arabic">Arabic</option>
      <option value="english">English</option>
      <option value="music">Music</option>
    </select>
    <select id="levelFilter">
      <option value="all">All Levels</option>
      <option value="beginner">Beginner</option>
      <option value="intermediate">Intermediate</option>
      <option value="advanced">Advanced</option>
      <option value="fun">Fun</option>
    </select>
    <input type="text" id="searchInput" placeholder="Search by title..." />
  </div>

  <div class="quiz-container" id="quizContainer">
    <!-- JS dynamically injects quiz cards here -->
  </div>

  <footer>
    Let’s make learning playful & powerful 💡
  </footer>

  <script>
    // Match this structure to your actual DB values (numeric quiz_id)
    const quizzes = [
      { quiz_id: 1, title: "Math", level: "beginner", subject: "math", questions: 12 },
      { quiz_id: 2, title: "Science", level: "intermediate", subject: "science", questions: 10 },
      { quiz_id: 3, title: "History", level: "advanced", subject: "history", questions: 8 },
      { quiz_id: 4, title: "Arabic", level: "beginner", subject: "arabic", questions: 15 },
      { quiz_id: 5, title: "English", level: "intermediate", subject: "english", questions: 20 },
      { quiz_id: 6, title: "Music", level: "beginner", subject: "music", questions: 7 },
      { quiz_id: 7, title: "Algebra Essentials", level: "beginner", subject: "math", questions: 12 },
      { quiz_id: 9, title: "Pop Music Legends", level: "fun", subject: "music", questions: 10 },
      { quiz_id: 8, title: "Space Science", level: "intermediate", subject: "science", questions: 14 }
    ];

    const quizContainer = document.getElementById("quizContainer");
    const subjectFilter = document.getElementById("subjectFilter");
    const levelFilter = document.getElementById("levelFilter");
    const searchInput = document.getElementById("searchInput");

    function renderQuizzes() {
      const subject = subjectFilter.value;
      const level = levelFilter.value;
      const search = searchInput.value.toLowerCase();

      quizContainer.innerHTML = "";

      const filtered = quizzes.filter(q => {
        const subjectMatch = subject === "all" || q.subject === subject;
        const levelMatch = level === "all" || q.level === level;
        const searchMatch = q.title.toLowerCase().includes(search);
        return subjectMatch && levelMatch && searchMatch;
      });

      if (filtered.length === 0) {
        quizContainer.innerHTML = `<p>No quizzes found.</p>`;
        return;
      }

      filtered.forEach(q => {
        const card = document.createElement("div");
        card.className = "quiz-card";
        card.innerHTML = `
          <h3>${q.title}</h3>
          <div class="quiz-meta">${q.questions} Questions <br><span class="level">Level: ${q.level}</span></div>
          <button onclick="window.location.href='fetchQuiz.php?quiz_id=${q.quiz_id}'">Start Quiz</button>
        `;
        quizContainer.appendChild(card);
      });
    }

    subjectFilter.addEventListener("change", renderQuizzes);
    levelFilter.addEventListener("change", renderQuizzes);
    searchInput.addEventListener("input", renderQuizzes);

    // Initial call
    renderQuizzes();
  </script>
</body>
</html>
